spring.config.import=optional:file:.env[.properties]

spring.application.name=cinestream

# Banco de dados PostgreSQL (Neon). Credenciais ficam no arquivo .env.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# O schema e criado pelo script SQL (src/main/resources/db/schema.sql).
# "validate" garante que o mapeamento das entidades bate com as tabelas reais.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.serialization.fail-on-empty-beans=false

# Cache: "simple" funciona sem Redis. Defina CACHE_TYPE=redis no .env para usar o Redis.
spring.cache.type=${CACHE_TYPE:simple}
spring.cache.redis.time-to-live=600000
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Upload de arquivos (avatar de perfil)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Amazon S3: guarda a imagem e mantem apenas a URL em perfil.avatar_url (Neon).
# Sem S3_BUCKET os endpoints de avatar respondem 503 e o restante da API segue normal.
app.s3.bucket=${S3_BUCKET:}
app.s3.region=${AWS_REGION:us-east-2}
app.s3.endpoint=${S3_ENDPOINT:${AWS_ENDPOINT_URL_S3:}}
app.s3.access-key-id=${AWS_ACCESS_KEY_ID:}
app.s3.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
app.s3.session-token=${AWS_SESSION_TOKEN:}
app.s3.public-base-url=${S3_PUBLIC_BASE_URL:}
app.s3.max-bytes=${S3_MAX_BYTES:5242880}

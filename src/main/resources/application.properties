spring.config.import=optional:file:.env[.properties]

spring.application.name=cinestream

# Banco de dados PostgreSQL (Neon). Credenciais ficam no arquivo .env.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# O schema e criado pelo script SQL (src/main/resources/db/schema.sql).
# "validate" garante que o mapeamento das entidades bate com as tabelas reais.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.serialization.fail-on-empty-beans=false

# Cache: "simple" funciona sem Redis. Defina CACHE_TYPE=redis no .env para usar o Redis.
spring.cache.type=${CACHE_TYPE:simple}
spring.cache.redis.time-to-live=600000
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
